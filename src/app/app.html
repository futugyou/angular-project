@if (!layoutService.isFullScreen()) {
<nav class="bg-primary text-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 p-2 rounded-lg">
          <ng-icon name="lucideLayoutDashboard" class="text-xl" size="1.2rem" color="red"></ng-icon>
        </div>
        <span class="text-xl font-bold tracking-tight">Angular Project</span>
      </div>

      <div class="flex items-center gap-2">
        <a
          routerLink="/"
          routerLinkActive="bg-white/20"
          [routerLinkActiveOptions]="{exact: true}"
          class="px-4 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition-colors flex items-center gap-2"
        >
          <ng-icon name="lucideHome" class="text-lg" size="1.2rem" color="red"></ng-icon>
          Home
        </a>

        <a
          routerLink="/orders"
          routerLinkActive="bg-white/20"
          class="px-4 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition-colors flex items-center gap-2"
        >
          <ng-icon name="lucideClipboardList" class="text-lg" size="1.2rem" color="red"></ng-icon>
          Orders
        </a>
      </div>
    </div>
  </div>
</nav>
}

<main [class]="layoutService.isFullScreen() ? '' : 'max-w-7xl mx-auto p-4 sm:p-6 lg:p-8'">
  <router-outlet />
</main>

<app-fullscreen-toggle />
