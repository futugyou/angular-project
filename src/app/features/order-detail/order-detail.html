<div class="order-detail-container">
    <table mat-table [dataSource]="orderDetails" class="mat-elevation-z8">

        <!-- Index Column -->
        <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef> # </th>
            <td mat-cell *matCellDef="let element"> {{element.index}} </td>
        </ng-container>

        <!-- Product Name Column -->
        <ng-container matColumnDef="productName">
            <th mat-header-cell *matHeaderCellDef> product name </th>
            <td mat-cell *matCellDef="let element"> {{element.productName}} </td>
        </ng-container>

        <!-- Product Code Column -->
        <ng-container matColumnDef="productCode">
            <th mat-header-cell *matHeaderCellDef> product code </th>
            <td mat-cell *matCellDef="let element"> {{element.productCode}} </td>
        </ng-container>

        <!-- Count Column -->
        <ng-container matColumnDef="count">
            <th mat-header-cell *matHeaderCellDef> quantity </th>
            <td mat-cell *matCellDef="let element"> {{element.count}} </td>
        </ng-container>

        <!-- Unit Name Column -->
        <ng-container matColumnDef="unitName">
            <th mat-header-cell *matHeaderCellDef> unit </th>
            <td mat-cell *matCellDef="let element"> {{element.unitName}} </td>
        </ng-container>

        <!-- Price Column -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef> unit price </th>
            <td mat-cell *matCellDef="let element"> {{element.price}} </td>
        </ng-container>

        <!-- All Price Column -->
        <ng-container matColumnDef="allPrice">
            <th mat-header-cell *matHeaderCellDef> total price </th>
            <td mat-cell *matCellDef="let element"> {{element.allPrice}} </td>
        </ng-container>

        <!-- Remark Column -->
        <ng-container matColumnDef="remark">
            <th mat-header-cell *matHeaderCellDef> Remarks </th>
            <td mat-cell *matCellDef="let element"> {{element.remark}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
