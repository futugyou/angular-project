<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AngularProject</title>
    <base id="angular-base" href="/" />
    <script>
      let baseUrl = './'
      if (window.__MICRO_APP_ENVIRONMENT__) {
        if (window.__MICRO_APP_BASE_ROUTE__) {
          baseUrl = window.__MICRO_APP_BASE_ROUTE__
        } else {
          baseUrl = '/angular/'
        }
      } else {
        const path = window.location.pathname
        baseUrl = path.startsWith('/angular') ? '/angular/' : '/'
      }
      baseUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/'
      const base = document.getElementById('angular-base')
      if (base) {
        base.setAttribute('href', baseUrl)
      }
      console.log('href is:', window.location.href, 'base url is:', baseUrl)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <angular-app-root></angular-app-root>
  </body>
</html>
